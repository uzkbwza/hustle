[package]
name = "gdzip"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gdnative = { version = "=0.11.3", default-features = false }
miniz_oxide = "0.8"
crc32fast = "1"
png = "0.17"
image-webp = "0.2"
md-5 = "0.10"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

# same patched gdnative-sys as tbfg-lib (see patched-deps/README.md)
[patch.crates-io]
gdnative-sys = { path = "patched-deps/gdnative-sys" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true

# gdnative's init macros check a feature this crate doesn't have
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("custom-godot"))'] }
